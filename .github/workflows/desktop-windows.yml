name: Build LinkiGram Desktop (Windows)

on:
  workflow_dispatch:
    inputs:
      tdesktop_ref:
        description: Telegram Desktop tag or commit to build
        required: false
        default: dev

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - name: Checkout LinkiGram
        uses: actions/checkout@v4

      - name: Checkout Telegram Desktop
        uses: actions/checkout@v4
        with:
          repository: telegramdesktop/tdesktop
          ref: ${{ inputs.tdesktop_ref }}
          path: desktop/tdesktop
          submodules: recursive

      - name: Initialize MSVC Native Tools (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare Telegram Desktop dependencies
        working-directory: desktop/tdesktop/Telegram
        shell: cmd
        run: |
          call build\prepare\win.bat

      - name: Configure Telegram Desktop
        working-directory: desktop/tdesktop/Telegram
        shell: cmd
        run: |
          if "%TELEGRAM_API_ID%"=="" exit /b 1
          if "%TELEGRAM_API_HASH%"=="" exit /b 1
          call configure.bat x64 -D TDESKTOP_API_ID=%TELEGRAM_API_ID% -D TDESKTOP_API_HASH=%TELEGRAM_API_HASH%

      - name: Build Telegram Desktop
        working-directory: desktop/tdesktop/Telegram
        shell: cmd
        run: |
          cmake --build ..\out --config Release --parallel

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkigram-desktop-windows
          path: desktop/tdesktop/out/Release
          if-no-files-found: error
