name: Build LinkiGram Desktop (Windows)

on:
  workflow_dispatch:
    inputs:
      tdesktop_ref:
        description: Telegram Desktop tag or commit to build
        required: false
        default: dev

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - name: Checkout LinkiGram
        uses: actions/checkout@v4

      - name: Checkout Telegram Desktop
        uses: actions/checkout@v4
        with:
          repository: telegramdesktop/tdesktop
          ref: ${{ inputs.tdesktop_ref }}
          path: desktop/tdesktop
          submodules: recursive

      - name: Build Telegram Desktop
        working-directory: desktop/tdesktop
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_API_ID) -or [string]::IsNullOrWhiteSpace($env:TELEGRAM_API_HASH)) {
            throw 'TELEGRAM_API_ID and TELEGRAM_API_HASH repository secrets are required.'
          }
          .\configure.bat -D TDESKTOP_API_ID=$env:TELEGRAM_API_ID -D TDESKTOP_API_HASH=$env:TELEGRAM_API_HASH
          cmake --build out --config Release --parallel

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkigram-desktop-windows
          path: desktop/tdesktop/out/Release
          if-no-files-found: error
